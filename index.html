<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Tolvink" />
  <meta name="theme-color" content="#1A6B37" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="description" content="Tolvink — Logística agrícola simplificada. Gestioná tus fletes desde el campo." />
  <title>Tolvink</title>

  <!-- Google Fonts (primary — full character set including accented) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <!-- Self-hosted fonts (offline fallback) -->
  <link rel="preload" href="/fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/fonts/fonts.css" />

  <!-- Preconnect to critical origins -->
  <link rel="preconnect" href="https://api.tolvink.com" crossorigin />
  <link rel="dns-prefetch" href="https://maps.googleapis.com" />
  <link rel="dns-prefetch" href="https://mlmecljidioymujsazrs.supabase.co" />

  <!-- Icons & manifest -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />

  <!-- Apple splash screens -->
  <link rel="apple-touch-startup-image" href="/splash/splash-1290x2796.svg" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" />
  <link rel="apple-touch-startup-image" href="/splash/splash-1179x2556.svg" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" />
  <link rel="apple-touch-startup-image" href="/splash/splash-1170x2532.svg" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" />
  <link rel="apple-touch-startup-image" href="/splash/splash-750x1334.svg" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)" />

  <style>
    html, body, #root {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    body {
      position: fixed;
      width: 100%;
      touch-action: pan-y;
    }
    body { overscroll-behavior-y: none; }
    @supports (padding: env(safe-area-inset-top)) {
      body { padding: 0; }
    }
    /* Prevent iOS Safari auto-zoom on form focus (triggers when font-size < 16px) */
    @media screen and (max-width: 768px) {
      input, select, textarea { font-size: 16px !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    // Emergency: unregister ALL service workers and purge ALL caches
    // This ensures stale SW cannot serve broken cached bundles
    // TODO: remove this block once all users have clean SWs (after 2026-03-18)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        regs.forEach(function(r) { r.unregister(); });
      });
      caches.keys().then(function(ks) {
        ks.forEach(function(k) { caches.delete(k); });
      });
    }
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
